name: "🚀 Relay · Migrate → Build → Deploy"
run-name: "🚀 Relay · D1 → Worker · ${{ github.ref_name }}"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/relay-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-d1-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: "☁️ Validate → migrate D1 → build → publish"
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.RELAY_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "🟢 Node.js 24"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: "🔒 Verify Cloudflare credentials"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions production/repository secrets."
            exit 1
          fi

      - name: "📦 Install locked dependencies"
        run: npm ci

      - name: "🔎 Validate TypeScript"
        run: npm run typecheck

      - name: "🧪 Unit + integration tests"
        run: npm test

      - name: "🗄️ Apply remote D1 migrations BEFORE build"
        run: npm run db:migrate:remote

      - name: "🏗️ Wrangler build (dry run)"
        run: npm run build

      - name: "🚀 Deploy relay Worker"
        run: npx wrangler deploy
