name: RodX D1 sync verification

on:
  push:
    branches:
      - main
      - ci/relay-migrate-before-build
  pull_request:
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rodx-ci.yml'
      - '.github/workflows/relay-deploy.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: 🗄️ Validate D1 migrations locally before build
        run: npm run db:migrate:local
      - name: 🏗️ Wrangler build (dry run, no production mutations)
        run: npm run build
