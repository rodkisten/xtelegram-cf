name: 🔒 Update package lock

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for the updated package-lock.json"
        required: false
        default: "chore(deps): update package lock"
        type: string

permissions:
  contents: write

concurrency:
  group: update-package-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-package-lock:
    name: 📦 Update package-lock.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📌 Setup npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: ℹ️ Show environment
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: 🔄 Update package-lock.json
        run: |
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: ✅ Validate package-lock.json with npm ci
        run: |
          rm -rf node_modules

          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: 🔎 Check package-lock.json changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ package-lock.json is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📦 package-lock.json was updated."
            git diff --stat -- package-lock.json
          fi

      - name: 📝 Commit package-lock.json
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json
          git commit -m "$COMMIT_MESSAGE"

      - name: 🚀 Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin "HEAD:${{ github.ref_name }}"

      - name: ✨ Nothing to update
        if: steps.changes.outputs.changed != 'true'
        run: |
          echo "package-lock.json is already synchronized with package.json."
