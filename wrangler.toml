name = "xtelegram-cf"
main = "src/index.ts"
compatibility_date = "2026-07-22"

[[d1_databases]]
binding = "RELAY_DB"
database_name = "xtelegram"
database_id = "8b1e7d2a-aa1c-4d0d-83ea-b1c60c7b513b"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
MAX_MEDIA_BYTES = "32000000"
HLS_CONCURRENCY = "4"
DELIVERY_CLAIM_TTL_SECONDS = "1800"
RELAY_DEBUG = "true"
TELEGRAM_CHAT_ID = "-1003991698263"
RELAY_TOKEN = "12345678"
TRLEGRAM_CHANNEL_ID = "-1003991698263"
TELEGRAM_BOT_TOKEN = "5667893762:AAHR069zL-Rhy9qMzOL4V9QKK4SES4boEYg"


# Optional username -> Telegram destination routing. Keys are case-insensitive.
# Destination formats:
#   <chat_id>                    => send to the chat itself
#   <chat_id>:<message_thread_id> => send to a forum topic in that supergroup
# A comma-separated key maps every username in that key to the same destinations.
# Explicit channel/channels from a request are UNIONED with mapped destinations.
# Deduplication is by (chat_id, message_thread_id), so different topics remain distinct.
#
# Topic example:
#   "@example": ["-1003991698263:42"]
#   "@example1,@example2": ["-1003991698263:42", "-1003991698263:87"]
TELEGRAM_USERNAME_CHANNEL_MAP_JSON = '''
{
  "@aesthrtiks,@iluvmenpics,@appreciation.male": ["-1003991698263:65"],
  "@rodkisten,@therodkisten,@rodinhocosta": ["-1003991698263:3"]
}
'''

# Keep credentials in Wrangler secrets, not in this file:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put RELAY_TOKEN
# TELEGRAM_CHAT_ID may also be stored as a secret if preferred.
