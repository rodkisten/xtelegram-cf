name = "xtelegram-cf"
main = "src/index.ts"
compatibility_date = "2026-07-22"

[[d1_databases]]
binding = "RELAY_DB"
database_name = "xtelegram"
database_id = "8b1e7d2a-aa1c-4d0d-83ea-b1c60c7b513b"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
MAX_MEDIA_BYTES = "32000000"
HLS_CONCURRENCY = "4"
DELIVERY_CLAIM_TTL_SECONDS = "1800"
RELAY_DEBUG = "true"
RELAY_TOKEN = "12345678"
TELEGRAM_CHAT_ID = "-1003991698263"
TRLEGRAM_CHANNEL_ID = "-1003991698263"
TELEGRAM_BOT_TOKEN = "5667893762:AAHR069zL-Rhy9qMzOL4V9QKK4SES4boEYg"

# Optional username -> Telegram chat routing. Keys are case-insensitive.
# A comma-separated key maps every username in that key to the same chats.
# Explicit channel/channels from a request are UNIONED with mapped chats and deduplicated.
TELEGRAM_USERNAME_CHANNEL_MAP_JSON = '''
{
  "@aesthrtiks,@iluvmenpics,@appreciation.male": ["-621561106"],
  "@rodkisten,@therodkisten,@rodinhocosta": ["-1003991698263"]
}
'''

# Keep TELEGRAM_BOT_TOKEN and RELAY_TOKEN in Wrangler secrets, not in this file:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put RELAY_TOKEN
# Optional fallback when neither channel(s) nor username routing resolves a destination:
#   npx wrangler secret put TELEGRAM_CHAT_ID
