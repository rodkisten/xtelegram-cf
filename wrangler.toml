name = "xtelegram-cf"
main = "src/index.ts"
compatibility_date = "2026-07-22"

[[d1_databases]]
binding = "RELAY_DB"
database_name = "xtelegram"
database_id = "8b1e7d2a-aa1c-4d0d-83ea-b1c60c7b513b"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
MAX_MEDIA_BYTES = "32000000"
HLS_CONCURRENCY = "4"
DELIVERY_CLAIM_TTL_SECONDS = "1800"
RELAY_DEBUG = "true"

# Optional username -> Telegram chat routing. Keys are case-insensitive.
# A comma-separated key maps every username in that key to the same chats.
# Explicit channel/channels from a request are UNIONED with mapped chats and deduplicated.
TELEGRAM_USERNAME_CHANNEL_MAP_JSON = '''
{
  "@USERNAME": ["-1001111111111", "-1002222222222"],
  "@username1,@username2": ["-1001111111111"]
}
'''

# Keep TELEGRAM_BOT_TOKEN and RELAY_TOKEN in Wrangler secrets, not in this file:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put RELAY_TOKEN
# Optional fallback when neither channel(s) nor username routing resolves a destination:
#   npx wrangler secret put TELEGRAM_CHAT_ID

# Optional resolver fallbacks.
# Cobalt no longer offers a public pre-hosted API for third-party integrations.
# Point this at your own Cobalt instance. Leave empty/omitted to skip it.
# COBALT_API_URL = "https://cobalt-api.example.com"
# COBALT_API_KEY = ""

# Cloudflare Workers cannot execute yt-dlp binaries. Point this at a tiny external
# service that accepts POST {"url":"..."} and returns media/formats JSON.
# YTDLP_API_URL = "https://ytdlp.example.com/resolve"
# YTDLP_API_TOKEN = ""

# Optional Piped API fallback for YouTube.
# Public instances exist, but they can be rate-limited or disappear. Prefer a stable
# instance you control or one you explicitly choose from the Piped instance list.
# PIPED_API_URL = "https://pipedapi.example.com"

